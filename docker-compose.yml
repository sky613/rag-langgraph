services:
  backend:
    build:
      context: ./backend
    container_name: rag_langgraph_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # 메타데이터 DB, ChromaDB, checkpoint를 컨테이너 재시작 후에도 유지한다.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: rag_langgraph_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
